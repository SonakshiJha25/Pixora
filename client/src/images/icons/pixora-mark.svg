<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="pix-bg" x1="10" y1="6" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="0.28" stop-color="#06b6d4"/>
      <stop offset="0.62" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <radialGradient id="pix-light" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(22 17) rotate(48) scale(42 48)">
      <stop stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pix-core" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(32 31) rotate(90) scale(17 17)">
      <stop stop-color="#fefce8"/>
      <stop offset="0.35" stop-color="#fef08a"/>
      <stop offset="0.75" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
    <filter id="pix-drop" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0b1224" flood-opacity="0.26"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#pix-bg)" filter="url(#pix-drop)"/>
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#pix-light)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="16.5" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Soft horizon glow (positive, upward energy) -->
  <ellipse cx="32" cy="50" rx="26" ry="12" fill="#ffffff" fill-opacity="0.12"/>

  <!-- Main “lens” — warm focal point, eye-catching -->
  <circle cx="32" cy="31" r="17" fill="url(#pix-core)" opacity="0.98"/>
  <circle cx="32" cy="31" r="17" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.25" fill="none"/>

  <!-- Catch-light (camera / focus) -->
  <ellipse cx="36" cy="26" rx="4" ry="3" fill="#ffffff" fill-opacity="0.9" transform="rotate(-18 36 26)"/>

  <!-- Bokeh accents (curves only — no crossed lines) -->
  <circle cx="48" cy="16" r="3.8" fill="#fef9c3" fill-opacity="0.9"/>
  <circle cx="14" cy="24" r="2.8" fill="#bae6fd" fill-opacity="0.75"/>
  <circle cx="44" cy="46" r="2.6" fill="#a5f3fc" fill-opacity="0.55"/>
</svg>
